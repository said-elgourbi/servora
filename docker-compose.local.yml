# Local browser development/QA overlay used by Make. The base Compose API retains
# its production authentication defaults when run without this overlay.
services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-4200}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy

