# Gradle and Android build settings for the Servora Android application.

# The build targets Java 17 bytecode; JDK 17 is the toolchain baseline.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Bound how long an idle daemon keeps its heap. The daemon holds roughly 5 GB and idles for 3 hours
# by default, which is long enough for several forgotten builds to exhaust the machine. Ten minutes
# still reuses one daemon across the builds of a single working session (test → lint → assemble)
# while releasing the memory soon after the session ends. `make android-stop` stops it immediately.
org.gradle.daemon.idletimeout=600000

android.useAndroidX=true

kotlin.code.style=official

# Application version (`docs/versioning.md` §8). `versionName` is the
# human-readable semver-aligned value; `versionCode` is the monotonic integer that
# must increase for every published build. They are the single source for
# `android/app/build.gradle.kts`; an individual build may override them with
# `-Pservora.versionName=… -Pservora.versionCode=…`.
servora.versionName=0.1.0
servora.versionCode=1
