server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API after a Compose rebuild changes its container address.
    resolver 127.0.0.11 valid=10s;
    set $servora_api http://api:3000;

    location ~ ^/(auth|jobs|customers|properties|home|schedule|technicians|push)(/|$) {
        proxy_pass $servora_api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass $servora_api$request_uri;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(js|css|png|svg|webmanifest|json|html)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
