# Servora foundation local development stack.
#
# The API + PostgreSQL are the long-lived system of record (BR-001); MinIO provides local
# object storage for development behind the S3 contract (ADR-013), so a deployment replaces it
# with an S3-compatible provider by configuration and never by code.
# This compose file provides the foundational services; Android and
# Angular development happen on the host against these services.
#
# Configuration comes from `.env` at the repository root (see .env.example).
name: servora

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servora}
      POSTGRES_DB: ${POSTGRES_DB:-servora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-servora} -d ${POSTGRES_DB:-servora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./api
    environment:
      # Hard-coded rather than configurable: the guarded development affordances
      # (`PASSWORD_RESET_DELIVERY=file`, `SMS_PROVIDER=file`) are refused in production, so a
      # local developer runs the API on the host to use them (`ADR-006` D3, D4).
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-servora}:${POSTGRES_PASSWORD:-servora}@postgres:5432/${POSTGRES_DB:-servora}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No default: a hard-coded secret would be a committed credential (dev.md §5).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in the repository-root .env (see .env.example)}
      # Authentication-flow configuration (BR-019, BR-043, BR-045; ADR-006). Every value has an
      # approved default, so a local stack only overrides what it wants to change.
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      PASSWORD_RESET_DELIVERY: ${PASSWORD_RESET_DELIVERY:-noop}
      PASSWORD_RESET_DELIVERY_DIRECTORY: ${PASSWORD_RESET_DELIVERY_DIRECTORY:-var/dev-notifications}
      # Transactional email delivery (BR-043, ADR-008). The no-op default keeps the stack bootable;
      # a deployment selects resend together with the credentials.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Local object storage for development evidence (BR-015, BR-027). The application contract is
  # S3, so this service is a development stand-in for the provider a deployment uses.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    # `--console-address` is required: without it the Console binds a random port and the
    # published MINIO_CONSOLE_PORT mapping would never reach it.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-servora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-servora-minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO's own readiness probe; the `mc` client ships inside this image.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # One-shot bucket bootstrap. Idempotent (`--ignore-existing`), so a fresh clone and an
  # already-running stack converge on the same state on every `make up`. This is stack setup
  # rather than application behaviour: a deployment provisions its bucket out of band, so the
  # API must never assume it may create one.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-servora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-servora-minio}
      S3_BUCKET: ${S3_BUCKET:-servora-dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set servora http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "servora/$$S3_BUCKET"
        mc anonymous set none "servora/$$S3_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
